name: Repair accepted CSV byte parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-accepted-csv-byte-parity.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore accepted CRLF CSV bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {'MANIFEST.csv':'c4fcbaad28708643205dafa6438bc073612837ff8cbfdcb0dc47a21223c53654'}
          for rel,want in expected.items():
              p=Path(rel)
              b=p.read_bytes()
              lf=b.replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              crlf=lf.replace(b'\n',b'\r\n')
              got=hashlib.sha256(crlf).hexdigest()
              if got != want:
                  raise SystemExit(f'{rel}: expected {want}, got {got}')
              p.write_bytes(crlf)
          a=Path('.gitattributes')
          lines=a.read_text().splitlines() if a.exists() else []
          if '*.csv -text' not in lines:
              lines.append('*.csv -text')
          a.write_text('\n'.join(lines)+'\n')
          PY
          git config user.name 'five-course-runtime-parity'
          git config user.email 'actions@users.noreply.github.com'
          git add .gitattributes MANIFEST.csv
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Restore accepted C3 CSV bytes for hosted parity'
          git push origin HEAD:main
