name: Master Runtime Smoke 2026
on:
  push:
    branches: [main, runtime-candidate/five-course-2026-09-11]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: master-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: C3 static runtime symbols and JS
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html curriculum.js manifest.webmanifest service-worker.js; do test -s "$f"; done
          python - <<'PY'
          import re,subprocess,pathlib
          h=pathlib.Path('index.html').read_text()
          for sym in ['function renderRepair()','function renderEvidence()','function renderJobs()']:
              assert sym in h,sym
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I)):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              f=pathlib.Path(f'/tmp/inline-{i}.js');f.write_text(m.group(2));subprocess.run(['node','--check',str(f)],check=True)
          print('PASS C3 runtime symbols and JS')
          PY
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: C3 browser runtime - mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 >/tmp/c3-http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 2
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          o=webdriver.ChromeOptions();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=390,844');o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,25)
          def severe(): return [x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
          try:
              d.get('http://127.0.0.1:8765/index.html');w.until(lambda x:x.execute_script('return document.readyState')=='complete');time.sleep(.4)
              d.execute_script('localStorage.clear();location.reload()');w.until(lambda x:x.execute_script('return document.readyState')=='complete');time.sleep(.4)
              assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+4,'mobile overflow'
              for v in ['home','learn','course','repair','evidence','jobs','reports']:
                  el=d.find_element(By.CSS_SELECTOR,f'.tab[data-view="{v}"]');d.execute_script('arguments[0].click()',el);time.sleep(.13)
                  assert d.find_element(By.ID,f'view-{v}').is_displayed(),v
                  err=severe();assert not err,(v,err[:5])
              d.execute_script('arguments[0].click()',d.find_element(By.CSS_SELECTOR,'.tab[data-view="learn"]'));time.sleep(.2)
              r=d.find_elements(By.CSS_SELECTOR,'#reviewBtn')
              if r: assert not r[0].is_enabled(),'fresh review unexpectedly enabled'
              sw=d.execute_async_script("""const done=arguments[0];const t=setTimeout(()=>done(false),12000);navigator.serviceWorker.ready.then(()=>{clearTimeout(t);done(true)}).catch(()=>{clearTimeout(t);done(false)});""");assert sw,'service worker not ready'
              err=severe();assert not err,err[:5]
              d.set_window_size(1280,900);d.refresh();w.until(lambda x:x.execute_script('return document.readyState')=='complete');time.sleep(.35)
              assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+4,'desktop overflow'
              err=severe();assert not err,err[:5]
              print('PASS C3 browser runtime')
          finally:d.quit()
          PY
      - name: Live Pages critical-byte parity
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          files=(index.html manifest.webmanifest service-worker.js curriculum.js)
          pass=0
          for attempt in $(seq 1 40); do
            ok=1
            for f in "${files[@]}"; do
              tmp="/tmp/live-$(basename "$f")"; curl -fsSL --retry 2 "${BASE}${f}?qa=${GITHUB_SHA}-${attempt}" -o "$tmp" || { ok=0; break; }
              [[ "$(sha256sum "$f"|awk '{print $1}')" == "$(sha256sum "$tmp"|awk '{print $1}')" ]] || { ok=0; break; }
            done
            [[ "$ok" == 1 ]] && { pass=1; break; }; sleep 15
          done
          test "$pass" == 1
          echo 'PASS C3 live Pages parity'
