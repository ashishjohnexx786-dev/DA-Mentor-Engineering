name: Deploy final Four-Course Mentor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-final-four-course.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Download and verify locked C3 deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e778-8211-9702-b593da9f4924/raw?se=2026-09-09T17%3A41%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=63f0f28a-5aec-5a71-9197-9c975f68ef2b&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T05%3A48%3A57Z&ske=2026-09-10T05%3A48%3A57Z&sks=b&skv=2026-02-06&sig=SbAw9DIY5mbvx2hItoW4XPRifENJWB3ivwstbWY/WdA%3D' -o /tmp/handoff.zip
          rm -rf /tmp/handoff /tmp/deploy; mkdir -p /tmp/handoff /tmp/deploy
          unzip -q /tmp/handoff.zip -d /tmp/handoff
          echo '7c852194ba690b121b1e79f07c2df1f3284fc3ec8a8ca703a66f0cf1f6da58cb  /tmp/handoff/C3_GITHUB_MAIN_DEPLOY.zip' | sha256sum -c -
          unzip -q /tmp/handoff/C3_GITHUB_MAIN_DEPLOY.zip -d /tmp/deploy
          python - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path('/tmp/deploy'); m=json.loads((d/'DEPLOY_MANIFEST.json').read_text())
          for f in m['files']:
              p=d/f['path']; b=p.read_bytes(); assert len(b)==f['bytes']; assert hashlib.sha256(b).hexdigest()==f['sha256']
          assert m['assetCount']==116 and m['protectedC3_112Bundled'] is False and m['finalGate']=='C3-113'
          print('C3 final-sync deploy manifest PASS')
          PY
      - name: Replace stale Mentor runtime with final locked files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' ! -name '.nojekyll' -exec rm -rf {} +
          cp -a /tmp/deploy/. .
          git config user.name 'Four-Course Final Deploy'; git config user.email 'actions@users.noreply.github.com'
          git add -A; git diff --cached --quiet && exit 0
          git commit -m 'Deploy final C3 Mentor 2026 C3-110-to-C3-116 sync'
          git push origin main
