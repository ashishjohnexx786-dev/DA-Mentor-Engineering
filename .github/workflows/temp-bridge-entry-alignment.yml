name: Temporary Bridge Entry Alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-bridge-entry-alignment.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Engineering entry gate to Course 2B Bridge
        shell: python
        run: |
          from pathlib import Path
          repls={
            'index.html':[
              ('Course 3 begins only after Course 2 Final Gate + C2-113 readiness floors.','Course 3 begins after the Course 2B Bridge Capstone + BRIDGE-062 Entry Gate readiness floors. Course 2A remains optional.'),
              ('Course 2 → Course 3 readiness','Course 2B Bridge → Course 3 readiness'),
              ('<b>Course 2 Final Gate passed</b><div class="muted tiny">Required before Course 3 study unlock.</div>','<b>Course 2B Bridge Entry Gate passed</b><div class="muted tiny">Includes the independent Bridge Capstone and BRIDGE-062 readiness-floor check.</div>')],
            'app.js':[
              ('<b>Course 3 study unlocked.</b> C2 Final Gate and all C2-113 readiness floors are recorded as satisfied.','<b>Course 3 study unlocked.</b> Course 2B Bridge Entry Gate and all Bridge readiness floors are recorded as satisfied.'),
              ('Course 2 Final Gate is not recorded as passed. ','Course 2B Bridge Entry Gate is not recorded as passed. '),
              ('Complete Course 2 Final Gate and the C2-113 readiness floors in the Course Entry card. Course 3 progress controls stay locked until then.','Complete the Course 2B Bridge Capstone + BRIDGE-062 Entry Gate readiness floors in the Course Entry card. Course 3 progress controls stay locked until then.'),
              ('Do not start Course 3 yet. Repair the exact C2-113 readiness area below its floor.','Do not start Course 3 yet. Repair the exact Bridge Entry Gate readiness area below its floor.')],
            'README.md':[
              ('- C2 Final Gate + C2-113 entry readiness lock','- Course 2B Bridge Capstone + BRIDGE-062 Entry Gate readiness lock'),
              ('All three Mentors intentionally share','The Mentor family intentionally shares')],
            'service-worker.js':[("const CACHE='da-mentor-engineering-v2.9';","const CACHE='da-mentor-engineering-v3.0';")]
          }
          for fn,pairs in repls.items():
            p=Path(fn); s=p.read_text(encoding='utf-8')
            for old,new in pairs:
              if old not in s: raise SystemExit(f'Missing expected text in {fn}: {old}')
              s=s.replace(old,new)
            p.write_text(s,encoding='utf-8')
      - name: Commit aligned entry semantics
        shell: bash
        run: |
          set -e
          git config user.name 'Ashish Kumar'
          git config user.email 'ashishjohnexx786@gmail.com'
          git add index.html app.js README.md service-worker.js
          git commit -m 'Align Course 3 entry gate with Course 2B Bridge'
          git push
